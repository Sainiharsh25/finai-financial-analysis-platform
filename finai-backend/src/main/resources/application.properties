spring.application.name=finai-backend
# Server
spring.jpa.open-in-view=false
server.port=${PORT:8080}
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


# MySQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Alpha Vantage
alphavantage.api.key=${ALPHAVANTAGE_API_KEY}
alphavantage.base.url=https://www.alphavantage.co/query

# Provider symbols: set these after verifying them with Alpha Vantage
alphavantage.symbol.RELIANCE=${ALPHAVANTAGE_RELIANCE_SYMBOL:RELIANCE}
alphavantage.symbol.TCS=${ALPHAVANTAGE_TCS_SYMBOL:TCS}
alphavantage.symbol.INFY=${ALPHAVANTAGE_INFY_SYMBOL:INFY}
alphavantage.symbol.HDFCBANK=${ALPHAVANTAGE_HDFCBANK_SYMBOL:HDFCBANK}

# Ollama / Llama 3.2
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2
